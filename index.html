<!DOCTYPE html>
<html>

<head>
  <title>Basic Snake HTML Game</title>
  <meta charset="UTF-8">
	<meta name="viewport" content="width=600, height=600, initial-scale=1">
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">
  <meta name="description" content="Description of your web app">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta charset="UTF-8">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: black;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    canvas {
      border: 1px solid white;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 48px);
      gap: 4px;
    }

    .dpad button {
      color: white;
      background: #222;
      border: 1px solid #888;
      border-radius: 6px;
      font-size: 22px;
      touch-action: manipulation;
      user-select: none;
    }

    .dpad button.selected {
      background: #2f7d32;
    }

    .dpad button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    .dpad-up { grid-column: 2; }
    .dpad-left { grid-column: 1; grid-row: 2; }
    .dpad-down { grid-column: 2; grid-row: 2; }
    .dpad-right { grid-column: 3; grid-row: 2; }

  </style>
</head>

<body>
  <canvas width="400" height="400" id="game"></canvas>
  <div class="dpad" aria-label="Snake controls">
    <button class="dpad-up" data-direction="up" aria-label="Move up" aria-pressed="false">▲</button>
    <button class="dpad-left" data-direction="left" aria-label="Move left" aria-pressed="false">◀</button>
    <button class="dpad-down" data-direction="down" aria-label="Move down" aria-pressed="false">▼</button>
    <button class="dpad-right selected" data-direction="right" aria-label="Move right" aria-pressed="true">▶</button>
  </div>
  <script>
    var canvas = document.getElementById('game');
    var context = canvas.getContext('2d');

    // the canvas width & height, snake x & y, and the apple x & y, all need to be a multiples of the grid size in order for collision detection to work
    // (e.g. 16 * 25 = 400)
    var grid = 16;
    var count = 0;
    var normalFrameDelay = 4;
    var speedBoostUntil = 0;
    var cheatUntil = 0;
    var lastArrowKey = null;
    var lastArrowTap = 0;
    var konamiSequence = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'Return', 'Escape'];
    var konamiIndex = 0;
    var dpadButtons = Array.from(document.querySelectorAll('.dpad button'));

    function syncDpadSelection(direction, focusButton) {
      dpadButtons.forEach(function (button) {
        var selected = button.dataset.direction === direction;
        button.classList.toggle('selected', selected);
        button.setAttribute('aria-pressed', selected ? 'true' : 'false');
        if (selected && focusButton) {
          button.focus({preventScroll: true});
        }
      });
    }

    function focusDpadDirection(direction) {
      var button = document.querySelector('.dpad button[data-direction="' + direction + '"]');
      if (button) {
        button.focus({preventScroll: true});
      }
    }

    var snake = {
      x: 160,
      y: 160,

      // snake velocity. moves one grid length every frame in either the x or y direction
      dx: grid,
      dy: 0,

      // keep track of all grids the snake body occupies
      cells: [],

      // length of the snake. grows when eating an apple
      maxCells: 4
    };
    var apple = {
      x: 320,
      y: 320
    };

    // get random whole numbers in a specific range
    // @see https://stackoverflow.com/a/1527820/2124254
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    // game loop
    function loop() {
      requestAnimationFrame(loop);

      // Slow the game loop to 15 fps instead of 60 (60/15 = 4).
      // During a double-tap boost, update twice as often for a short time.
      var now = Date.now();
      var cheatActive = now < cheatUntil;
      var frameDelay = cheatActive ? 1 : (now < speedBoostUntil ? normalFrameDelay / 2 : normalFrameDelay);
      if (++count < frameDelay) {
        return;
      }

      count = 0;
      context.clearRect(0, 0, canvas.width, canvas.height);

      // move snake by it's velocity
      snake.x += snake.dx;
      snake.y += snake.dy;

      // wrap snake position horizontally on edge of screen
      if (snake.x < 0) {
        snake.x = canvas.width - grid;
      }
      else if (snake.x >= canvas.width) {
        snake.x = 0;
      }

      // wrap snake position vertically on edge of screen
      if (snake.y < 0) {
        snake.y = canvas.height - grid;
      }
      else if (snake.y >= canvas.height) {
        snake.y = 0;
      }

      // keep track of where snake has been. front of the array is always the head
      snake.cells.unshift({x: snake.x, y: snake.y});

      // remove cells as we move away from them
      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      // draw apple
      context.fillStyle = 'red';
      context.fillRect(apple.x, apple.y, grid - 1, grid - 1);

      // draw snake one cell at a time
      snake.cells.forEach(function (cell, index) {

        context.fillStyle = cheatActive
          ? 'hsl(' + ((now / 4 + index * 35) % 360) + ', 100%, 50%)'
          : 'green';

        // drawing 1 px smaller than the grid creates a grid effect in the snake body so you can see how long it is
        context.fillRect(cell.x, cell.y, grid - 1, grid - 1);

        // snake ate apple
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;

          // canvas is 400x400 which is 25x25 grids
          apple.x = getRandomInt(0, 25) * grid;
          apple.y = getRandomInt(0, 25) * grid;
        }

        // check collision with all cells after this one (modified bubble sort)
        // The Konami mode makes the snake invulnerable for its duration.
        for (var i = index + 1; !cheatActive && i < snake.cells.length; i++) {

          // snake occupies same space as a body part. reset game
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            snake.x = 160;
            snake.y = 160;
            snake.cells = [];
            snake.maxCells = 4;
            snake.dx = grid;
            snake.dy = 0;

            apple.x = getRandomInt(0, 25) * grid;
            apple.y = getRandomInt(0, 25) * grid;
          }
        }
      });
    }

    function setDirection(direction) {
      if (direction === 'left' && snake.dx === 0) {
        snake.dx = -grid;
        snake.dy = 0;
        syncDpadSelection(direction, false);
      }
      else if (direction === 'up' && snake.dy === 0) {
        snake.dy = -grid;
        snake.dx = 0;
        syncDpadSelection(direction, false);
      }
      else if (direction === 'right' && snake.dx === 0) {
        snake.dx = grid;
        snake.dy = 0;
        syncDpadSelection(direction, false);
      }
      else if (direction === 'down' && snake.dy === 0) {
        snake.dy = grid;
        snake.dx = 0;
        syncDpadSelection(direction, false);
      }
    }

    dpadButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        setDirection(button.dataset.direction);
        syncDpadSelection(button.dataset.direction, true);
      });

      button.addEventListener('keydown', function (e) {
        var nextDirection = ({
          ArrowUp: 'up',
          ArrowDown: 'down',
          ArrowLeft: 'left',
          ArrowRight: 'right'
        })[e.key];

        if (nextDirection) {
          e.preventDefault();
          e.stopPropagation();
          focusDpadDirection(nextDirection);
        }
      });
    });

    // listen to keyboard events to move the snake
    document.addEventListener('keydown', function (e) {
      var konamiKey = e.key === 'Enter' ? 'Return' : e.key;

      if (konamiKey === konamiSequence[konamiIndex]) {
        konamiIndex++;
        if (konamiIndex === konamiSequence.length) {
          cheatUntil = Date.now() + 30000;
          konamiIndex = 0;
        }
      }
      else {
        konamiIndex = konamiKey === konamiSequence[0] ? 1 : 0;
      }

      var key = e.which || ({
        ArrowLeft: 37,
        ArrowUp: 38,
        ArrowRight: 39,
        ArrowDown: 40
      })[e.key];

      // Pressing the arrow matching the current movement direction twice
      // within 300 ms briefly doubles speed.
      if (key >= 37 && key <= 40) {
        var now = Date.now();
        var matchesMovement =
          (key === 37 && snake.dx < 0) ||
          (key === 38 && snake.dy < 0) ||
          (key === 39 && snake.dx > 0) ||
          (key === 40 && snake.dy > 0);

        if (matchesMovement && key === lastArrowKey && now - lastArrowTap <= 300) {
            speedBoostUntil = now + 1200;
            lastArrowKey = null;
        }
        else if (matchesMovement) {
          lastArrowKey = key;
          lastArrowTap = now;
        }
        else {
          lastArrowKey = null;
          lastArrowTap = 0;
        }
      }

      // prevent snake from backtracking on itself by checking that it's
      // not already moving on the same axis (pressing left while moving
      // left won't do anything, and pressing right while moving left
      // shouldn't let you collide with your own body)

      // left arrow key
      if (key === 37) {
        setDirection('left');
      }
      // up arrow key
      else if (key === 38) {
        setDirection('up');
      }
      // right arrow key
      else if (key === 39) {
        setDirection('right');
      }
      // down arrow key
      else if (key === 40) {
        setDirection('down');
      }
    });

    // start the game
    requestAnimationFrame(loop);
  </script>
</body>

</html>
